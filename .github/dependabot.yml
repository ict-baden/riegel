version: 2
# Kein automatisches Rebase: jedes Rebase startet Build und Sammler-Läufe und kostet Actions-Minuten.
updates:
  - package-ecosystem: nuget
    directory: "/"
    rebase-strategy: disabled
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Fester Compiler und Referenzassemblys des Sammlers (Hash-Sperre): ein Update ändert die Bytes der Exe, also nur
      # bewusst zusammen mit neuer collector-version.txt, collector.sha256 und neu aufgezeichneten Runner-Fixtures
      - dependency-name: "Microsoft.Net.Compilers.Toolset"
      - dependency-name: "Microsoft.NETFramework.ReferenceAssemblies.net35"
      # System.* und Microsoft.Extensions.* folgen der .NET-Hauptversion (net10.0): Major nur mit dem bewussten Umstieg
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # Diese Sprünge wechseln die Lizenz und sind nach der internen Richtlinie 02 nicht erlaubt (Lizenzen in CLAUDE.md
      # und docs/development.md):
      # PDFsharp und MigraDoc: 6.2.x ist MIT, ab 6.5.0 AGPL-3.0 – nur Patch-Updates
      - dependency-name: "PDFsharp*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # SixLabors.Fonts (direkt gepinnt, über ClosedXML): 1.x ist Apache-2.0, ab 2.0 Six Labors Split License
      - dependency-name: "SixLabors.*"
        update-types: ["version-update:semver-major"]
      # WiX: 5.x ist MS-RL, ab 6.0 gilt die OSMF-EULA (Gebühr für Firmen)
      - dependency-name: "WixToolset.*"
        update-types: ["version-update:semver-major"]
      # JsonSchema.Net (nur Tests): 8.x ist MIT, ab 9.0 gilt die OSMF-EULA
      - dependency-name: "JsonSchema.Net"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    rebase-strategy: disabled
    schedule:
      interval: monthly
  # Banner der Doku (playwright-core)
  - package-ecosystem: npm
    directory: "/tools/banner"
    rebase-strategy: disabled
    schedule:
      interval: monthly
