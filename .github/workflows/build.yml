# Nach der Vorlage der internen ICT-Baden-Richtlinien (nicht öffentlich; „Richtlinie NN“ unten meint diese) und dem
# Workflow von Zutritt. Job „linux“ baut und testet den plattformneutralen Teil (Core, Befehle; Richtlinie 02); der Job
# „windows“ startet erst, wenn er grün ist, baut alles (auch den net35-Sammler), packt und veröffentlicht selbst – ohne
# Umweg über Artefakte (deren Speicher teilen sich alle Repos der Organisation; ist er voll, darf das kein Release
# verhindern). Jedes Release enthält eine Stückliste (SBOM, Richtlinie 06), öffentliche Repos einen Herkunftsnachweis
# (Richtlinie 05). Schritte, die Pakete später mit Leben füllen (Lese-Nachweis, Demo-Bericht), prüfen selbst, ob ihr
# Skript da ist. Der Workflow collector.yml (Sammler auf drei Runnern, Nur-Lesen-Nachweis) gehört dem Paket collector.
#
# Wann wie viel gebaut wird (Richtlinie 04, „Wann die CI baut“; beschrieben in docs/development.md): Pushs und PRs
# bauen nur den Job „linux“, die Jobs „windows“ und „release-check“ gibt es nachts (nur wenn main neu ist), bei Tags,
# von Hand, mit [voll] in der Commit-Nachricht und bei PRs mit Label voll-bauen oder Windows-Pfaden (FULL_PATHS).
# Reine Doku startet nichts.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # Pfadfilter gelten für Tags nicht, ein Tag baut immer
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  schedule:
    - cron: '51 2 * * *' # Minute je Repo anders, damit nicht alle gleichzeitig starten
  workflow_dispatch:

permissions:
  contents: read

# In PRs bricht ein neuer Push den überholten Lauf ab (spart Minuten). Auf main und bei Tags laufen die Läufe
# nacheinander zu Ende: Ein Push, der nur „linux“ baut, darf keinen vollen Lauf (Nachtlauf, [voll]) abbrechen.
# release-latest.ps1 veröffentlicht nur den neuesten Stand von main und räumt Reste abgebrochener Läufe auf.
# Ein fremdes Label (nicht voll-bauen) startet zwar einen Lauf, der Job „gate“ setzt ihn aber auf run=false; damit er
# keinen echten Lauf desselben PR abbricht, bekommt er eine eigene Gruppe.
concurrency:
  group: build-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'voll-bauen') && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP: "Riegel"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Signieren nur, wenn die Organisation Artifact Signing eingerichtet hat (Richtlinie 05, Signieren)
  # und nicht bei Pull Requests (dort gibt es kein OIDC-Token mit den nötigen Rechten).
  SIGN: ${{ vars.SIGNING_ACCOUNT != '' && github.event_name != 'pull_request' }}

jobs:
  # Entscheidet, wie viel dieser Lauf baut. run=false: nichts zu tun (Nachtlauf ohne neue Commits).
  # full=true: Windows, Pakete, Signieren, Releases. Sonst nur der Linux-Teil (bei Apps mit plattformneutralem Kern).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      full: ${{ steps.gate.outputs.full }}
    steps:
      - name: Umfang bestimmen
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          MSG: ${{ github.event.head_commit.message }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number }}
          # Geänderte Dateien, bei denen ein PR den Job „windows“ braucht: alles, was Linux nicht baut oder testet
          # (WPF-App, Windows-Anbindung, Sammler, Befehlszeile für Windows, Windows-Tests, Bordmittel, Nur-Lesen-Nachweis,
          # MSI, Hinweise der Laufzeit, Build-Einstellungen, Lizenztexte im Paket). Dazu der Erhebungsplan (in die
          # Sammler-Exe eingebettet: Hash-Sperre), das Snapshot-Schema (Sammler-Tests) und die Projektdateien von Core und
          # Befehlen (Paket-Updates: Lizenzhinweise aller Pakete der App prüft nur der Windows-Test)
          FULL_PATHS: '^(\.github/|installer/|src/Riegel/|src/Riegel\.(Platform\.Windows|Collector|Cli)/|src/Riegel\.(Core|Commands)/[^/]+\.csproj$|tests/Riegel\.Tests/(Windows/|Riegel\.Tests\.csproj$)|tools/(collect-builtin|readonly-proof)/|contracts/|schemas/snapshot\.schema\.json$|notices/|\.config/|Directory\.Build\.(props|targets)$|global\.json$|Riegel\.sln$|THIRD-PARTY-NOTICES\.txt$)'
          # Reine Doku, wie paths-ignore oben
          DOC_PATHS: '(\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/)'
        run: |
          set -euo pipefail
          run=true; full=false
          case "$EVENT" in
            workflow_dispatch) full=true ;;
            push)
              # Bei mehreren Commits in einem Push zählt die Nachricht des letzten
              if [ "$GITHUB_REF_TYPE" = tag ] || [[ "$MSG" == *"[voll]"* ]]; then full=true; fi ;;
            pull_request)
              # Ein anderes Label als voll-bauen ändert nichts am Code: kein neuer Lauf
              if [ "$ACTION" = labeled ] && [ "$LABEL" != voll-bauen ]; then
                run=false
              else
                files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
                if [[ ",$LABELS," == *",voll-bauen,"* ]] || grep -qE "$FULL_PATHS" <<< "$files"; then full=true; fi
              fi ;;
            schedule)
              # Der Tag 'latest' steht auf dem Commit des letzten vollen Builds von main
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq .object.sha 2>/dev/null || true)
              if [ "$built" = "$GITHUB_SHA" ]; then
                run=false
              else
                # Scheitert der Vergleich (kein 'latest', Verlauf umgeschrieben), wird voll gebaut
                changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$built...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null || echo '?')
                if [ -n "$built" ] && ! grep -qvE "$DOC_PATHS" <<< "$changed"; then run=false; else full=true; fi # sonst nur Doku
              fi ;;
          esac
          echo "Ereignis: $EVENT  run=$run  full=$full"
          { echo "run=$run"; echo "full=$full"; } >> "$GITHUB_OUTPUT"

  linux:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: PowerShell-Syntax (alle Workflow-Schritte und Skripte)
        # Auch die Schritte, die nur bei Tags oder auf main laufen: ein typografisches Anführungszeichen in einem String
        # bricht sonst erst den Release-Lauf ab (Lupe, Vitrine am 2026-10-21)
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user pyyaml
          python3 .github/scripts/ps-syntax.py > "$RUNNER_TEMP/ps-blocks.json"
          pwsh -NoProfile -File .github/scripts/ps-syntax.ps1 -Blocks "$RUNNER_TEMP/ps-blocks.json"

      - name: Schriften für die PDF-Tests
        # Segoe UI gibt es unter Linux nicht: freie Schriften für die PDF-Dokumente (Liberation ist metrisch gleich Arial).
        # zh-Hans: WenQuanYi Micro Hei (TrueType-Fläche aus der .ttc, die PDFsharp 6.2.4 einbetten kann); Noto CJK hat
        # CFF-Konturen und dient dem Test, dass der Schriftsucher sie ablehnt (Paket pdf, docs/reports.md).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-dejavu-core fonts-liberation fonts-noto-cjk fonts-wqy-microhei
          fc-list :lang=zh | head -n 20

      - name: Build
        run: dotnet build tests/Riegel.Tests -c Release -f net10.0

      - name: Tests
        # Nur der plattformneutrale Teil (Core, Befehle, Fixtures, Schemas, Katalog). Windows-Anbindung, App und
        # Sammler testet der Job „windows“.
        run: dotnet test tests/Riegel.Tests -c Release -f net10.0 --no-build --logger "trx;LogFileName=tests-linux.trx" --results-directory TestResults

      - name: Linux-Befehlszeile veröffentlichen (linux-x64, eine Datei)
        # Dieselben Schalter wie das Release (dort auf dem Windows-Runner übersetzt); hier, damit die Linux-Datei
        # unter Linux läuft – ohne Umweg über Artefakte
        run: >
          dotnet publish src/Riegel.Cli/Riegel.Cli.csproj -c Release -f net10.0 -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o out/linux-x64

      - name: Linux-Befehlszeile prüft und verifiziert Fixtures
        # check auf synthetischen Exporten (Exitcode 0–2 ist ein Ergebnis, 3 oder ein Absturz nicht), dann ein Anlagenordner
        # aus zwei Fixtures, ein Nachweispaket und verify (muss reproduzieren: Exitcode 0)
        shell: bash
        run: |
          cli=out/linux-x64/Riegel.Cli
          fixtures=tests/Riegel.Tests/Fixtures/synthetic
          "$cli" --version
          set +e
          "$cli" check --snapshot "$fixtures/win11-24h2-workgroup-admin.snapshot.json" --brief
          code=$?
          "$cli" check --snapshot "$fixtures/win11-24h2-workgroup-admin.snapshot.json" --format json > smoke.json
          json=$?
          set -e
          echo "check --brief: $code, check --format json: $json"
          head -c 600 smoke.json; echo
          if [ "$code" -gt 2 ] || [ "$json" -gt 2 ]; then echo "::error::riegel check endete mit $code/$json"; exit 1; fi
          work="$RUNNER_TEMP/riegel-linux"
          "$cli" plant init "$work/plant" --name "CI Linux"
          set +e
          "$cli" import "$fixtures/win11-24h2-workgroup-admin.snapshot.json" "$fixtures/server2022-domain-member.snapshot.json" --plant "$work/plant"
          code=$?
          set -e
          if [ "$code" -gt 2 ]; then echo "::error::riegel import endete mit $code"; exit 1; fi
          "$cli" report --plant "$work/plant" --evidence --format pdf,csv --out "$work/out"
          "$cli" verify "$work"/out/Riegel-Evidence_*.zip
          echo "verify: reproduziert"

      - name: Linux-Befehlszeile auf einem Minimal-System (debian:12-slim)
        # ubuntu-latest hat OpenSSL, ICU und Schriften; Minimal-Systeme nicht. Ohne sie: klare Meldungen (RGL-0018 mit
        # Exitcode 3, Hinweis RGL-0017) statt Abbruch mit 134; mit den Paketen aus docs/installation.md: check, report
        # und verify. Befund der Prüfung vom 2026-10-20.
        shell: bash
        run: >
          docker run --rm -v "$PWD/out/linux-x64:/app:ro" -v "$PWD/tests/Riegel.Tests/Fixtures/synthetic:/fx:ro"
          -v "$PWD/.github/scripts:/s:ro" debian:12-slim bash /s/linux-minimal-smoke.sh /app/Riegel.Cli /fx

      - name: Testergebnisse
        if: always()
        # Nur zur Fehlersuche: Ist der Artefaktspeicher der Organisation voll, bleibt der Lauf trotzdem grün
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Testergebnisse-linux
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  windows:
    # Erst bauen und veröffentlichen, wenn der plattformneutrale Teil auch unter Linux grün ist. Nur beim vollen Build
    # (Job „gate“, Richtlinie 04).
    needs: [gate, linux]
    if: needs.gate.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # für die Releases
      id-token: write # Anmeldung bei Azure Artifact Signing (OIDC) und Herkunftsnachweis
      attestations: write # Herkunftsnachweis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          # Tag v1.2.3 -> 1.2.3, sonst Basisversion aus Directory.Build.props mit Build-Nummer
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $base = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          # MSI kennt nur Zahlen. CI-Builds: Version + Lauf-Nummer als 4. Stelle (z. B. 0.1.0.12).
          # Windows Installer vergleicht nur drei Stellen, deshalb ersetzen sich CI-Builds gegenseitig
          # (AllowSameVersionUpgrades), und ein Release v0.1.1 ist immer neuer als jeder 0.1.0-CI-Build.
          $core = $v -replace '[-+].*$', ''
          $msi = if ($env:GITHUB_REF_TYPE -eq 'tag') { $core } else { "$core.$env:GITHUB_RUN_NUMBER" }
          # Dateiversion der Programme immer mit Lauf-Nummer, auch beim Tag: Windows Installer kopiert eine Datei bei einem
          # Update nur, wenn sie neuer ist als die installierte. Mit x.y.z.0 beim Tag (wie ein CI-Build derselben Version)
          # entschied es beim Update von latest auf das Release „gleich alt, nicht kopieren“ und entfernte danach die alte
          # Version - die Exe fehlte (bei Vitrine gefunden). Die Lauf-Nummer steigt, das Release ist also immer neuer.
          $filever = "$core.$env:GITHUB_RUN_NUMBER"
          # Dateinamen: Releases aus einem Tag mit Version, sonst fest, damit die Links auf 'latest' dauerhaft gelten
          $suffix = if ($env:GITHUB_REF_TYPE -eq 'tag') { "-$v" } else { '' }
          # Der Sammler hat seine eigene Version (docs/collector.md)
          $collector = (Get-Content src/Riegel.Collector/collector-version.txt -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT
          "filever=$filever" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "collector=$collector" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v  MSI: $msi  Dateiversion: $filever  Sammler: $collector  Signieren: $env:SIGN"

      - name: Endgültiges Release nur aus einem öffentlichen Repo
        # Den Herkunftsnachweis gibt es nur in öffentlichen Repos; ein Release ohne ihn ließe sich nicht nachholen
        # (ein neuer Build hat andere Bytes). Vorabversionen (v1.0.0-rc1) dürfen auch aus einem privaten Repo kommen.
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-') && github.event.repository.private
        shell: pwsh
        run: |
          throw 'Das Repo ist privat: endgültige Releases erst, wenn es öffentlich ist (docs/development.md, Releases).'

      - name: Release-Text prüfen (nur bei Tag v*)
        # Vor dem Bauen: ohne englischen CHANGELOG-Teil („### English“) entstünde ein Release ohne Text
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./.github/scripts/release-notes.ps1 -Version '${{ steps.version.outputs.version }}' | Out-Null

      - name: Restore
        run: dotnet restore "${{ env.APP }}.sln"

      - name: Build
        # Die Lösung enthält den net35-Sammler; er ignoriert die CI-Version (TreatAsLocalProperty)
        run: dotnet build "${{ env.APP }}.sln" -c Release --no-restore

      - name: Tests
        run: dotnet test "${{ env.APP }}.sln" -c Release --no-build -p:TestTfmsInParallel=false --logger "trx;LogFilePrefix=tests" --results-directory TestResults

      - name: Testergebnisse
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Testergebnisse-windows
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Sammler zweimal bauen und Prüfsumme vergleichen
        id: collector
        shell: pwsh
        run: |
          # Bytegleicher Build (docs/collector.md): zwei vollständige Builds in zwei Ordner, dann Hash-Sperre gegen collector.sha256
          $project = 'src/Riegel.Collector/Riegel.Collector.csproj'
          foreach ($dir in 'out/collector-a', 'out/collector-b') {
            dotnet build $project -c Release --no-incremental -o $dir
            if ($LASTEXITCODE -ne 0) { throw "Sammler-Build nach $dir fehlgeschlagen ($LASTEXITCODE)" }
          }
          $a = (Get-FileHash out/collector-a/Riegel.Collector.exe -Algorithm SHA256).Hash.ToLower()
          $b = (Get-FileHash out/collector-b/Riegel.Collector.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Sammler ${{ steps.version.outputs.collector }}: $a (Größe $((Get-Item out/collector-a/Riegel.Collector.exe).Length) Bytes)"
          if ($a -ne $b) { throw "Sammler nicht bytegleich: $a / $b" }
          # Die Sperre ist Pflicht: collector.sha256 muss ein SHA-256 sein (kein „unset“ mehr)
          $expected = (Get-Content src/Riegel.Collector/collector.sha256 -Raw).Trim()
          if ($expected -cnotmatch '^[0-9a-f]{64}$') {
            throw "collector.sha256 enthält keinen SHA-256 in Kleinbuchstaben ('$expected'), die Hash-Sperre ist Pflicht; gebaut: $a"
          } elseif ($expected -ne $a) {
            throw "Sammler-Bytes geändert ohne Versionssprung: erwartet $expected, gebaut $a (collector-version.txt anheben und collector.sha256 setzen)."
          }
          "sha256=$a" >> $env:GITHUB_OUTPUT

      - name: Sammler-Version gegen veröffentlichte Tags
        # Eine veröffentlichte Sammler-Version hat für immer genau einen Hash: dieselbe collector-version.txt mit anderem
        # collector.sha256 als in einem Tag (auch Vorabversionen) ist ein vergessener Versionssprung. Läuft bei jedem
        # vollen Build, damit der Fehler vor dem Tag und vor 'latest' auffällt.
        shell: pwsh
        run: |
          $version = (Get-Content src/Riegel.Collector/collector-version.txt -Raw).Trim()
          $hash = (Get-Content src/Riegel.Collector/collector.sha256 -Raw).Trim().ToLower()
          git fetch --quiet --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          if ($LASTEXITCODE -ne 0) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') { throw "Tags ließen sich nicht holen ($LASTEXITCODE) – Versionsprüfung des Sammlers nicht möglich" }
            Write-Host "::warning::Tags ließen sich nicht holen ($LASTEXITCODE) – Versionsprüfung des Sammlers übersprungen"
            exit 0
          }
          $checked = 0
          foreach ($tag in @(git tag --list 'v*')) {
            $v = git show "${tag}:src/Riegel.Collector/collector-version.txt" 2>$null
            if ($LASTEXITCODE -ne 0) { continue }
            $h = git show "${tag}:src/Riegel.Collector/collector.sha256" 2>$null
            if ($LASTEXITCODE -ne 0) { continue }
            $v = ($v | Out-String).Trim(); $h = ($h | Out-String).Trim().ToLower()
            if ($h -notmatch '^[0-9a-f]{64}$') { continue } # vor der Hash-Sperre ('unset')
            $checked++
            if ($v -eq $version -and $h -ne $hash) {
              throw "Sammler $version ist mit $tag als $h veröffentlicht, gebaut ist ${hash} – collector-version.txt anheben."
            }
            if ($v -ne $version -and $h -eq $hash) {
              Write-Host "::warning::Der Hash $hash steht in $tag unter Sammler $v, jetzt unter $version – Versionssprung ohne Byteänderung?"
            }
          }
          Write-Host "Sammler $version ($hash): gegen $checked Tags mit Hash-Sperre geprüft"
          exit 0 # der Exitcode eines übersprungenen git show gilt nicht als Ergebnis

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $fv = "-p:FileVersion=${{ steps.version.outputs.filever }}"
          $gui = @("src/$env:APP/$env:APP.csproj", '-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', "-p:Version=$v", $fv, '-p:DebugType=none')
          # Oberfläche: benötigt .NET 10 Desktop Runtime / ohne Runtime-Abhängigkeit (Grundlage der MSI) / eine einzige Exe
          dotnet publish @gui --self-contained false -o out/framework
          if ($LASTEXITCODE -ne 0) { throw "Publish (framework) fehlgeschlagen ($LASTEXITCODE)" }
          dotnet publish @gui --self-contained true -o out/self-contained
          if ($LASTEXITCODE -ne 0) { throw "Publish (self-contained) fehlgeschlagen ($LASTEXITCODE)" }
          dotnet publish @gui --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/standalone
          if ($LASTEXITCODE -ne 0) { throw "Publish (Einzeldatei) fehlgeschlagen ($LASTEXITCODE)" }
          # Konsolenprogramm Riegel.Cli.exe (docs/command-line.md) neben die Oberfläche, dazu als einzelne Datei riegel-win-x64.exe
          $cli = @('src/Riegel.Cli/Riegel.Cli.csproj', '-c', 'Release', '-f', 'net10.0-windows', '-r', 'win-x64', '-p:PublishSingleFile=true', "-p:Version=$v", $fv, '-p:DebugType=none')
          dotnet publish @cli --self-contained false -o out/framework
          if ($LASTEXITCODE -ne 0) { throw "Publish CLI (framework) fehlgeschlagen ($LASTEXITCODE)" }
          dotnet publish @cli --self-contained true -o out/self-contained
          if ($LASTEXITCODE -ne 0) { throw "Publish CLI (self-contained) fehlgeschlagen ($LASTEXITCODE)" }
          dotnet publish @cli --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/cli-standalone
          if ($LASTEXITCODE -ne 0) { throw "Publish CLI (Einzeldatei) fehlgeschlagen ($LASTEXITCODE)" }
          # Linux x64 und arm64: auf diesem Runner übersetzt (Cross-Publish), damit das Release nicht von Artefakten abhängt
          foreach ($rid in 'linux-x64', 'linux-arm64') {
            dotnet publish src/Riegel.Cli/Riegel.Cli.csproj -c Release -f net10.0 -r $rid --self-contained true -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true "-p:Version=$v" $fv -p:DebugType=none -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publish $rid fehlgeschlagen ($LASTEXITCODE)" }
          }
          Get-ChildItem out/linux-x64, out/linux-arm64, out/cli-standalone | Format-Table Name, Length
          # PDFsharp-Zusatzbibliotheken (Segoe-WP-Schriften von Microsoft, Beispielcode) nie ausliefern (Directory.Build.targets)
          $extras = 'PdfSharp\.(WPFonts|Snippets|Quality)\.dll'
          $found = @(Get-ChildItem out -Recurse -File | Where-Object Name -Match "^$extras$") +
                   @(Get-ChildItem src -Recurse -Filter *.deps.json | Select-String -Pattern $extras -List)
          if ($found.Count -gt 0) { $found | Out-String | Write-Host; throw "PDFsharp-Zusatzbibliotheken in der Ausgabe oder einer deps.json" }
          # Windows-SDK-Projektion (Lizenz des Windows SDK, nicht MIT) nie ausliefern: Ziel bleibt net10.0-windows ohne SDK-Version
          $sdk = '(Microsoft\.Windows\.SDK\.NET|WinRT\.Runtime)\.dll'
          $found = @(Get-ChildItem out -Recurse -File | Where-Object Name -Match "^$sdk$") +
                   @(Get-ChildItem src -Recurse -Filter *.deps.json | Select-String -Pattern $sdk -List)
          if ($found.Count -gt 0) { $found | Out-String | Write-Host; throw "Windows-SDK-Projektion in der Ausgabe oder einer deps.json" }
          # Die mitgelieferten Hinweise der .NET-Laufzeit müssen die der veröffentlichten Runtime-Pakete sein (notices/README.md)
          $cache = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $HOME '.nuget/packages' }
          $ours = (Get-Content notices/THIRD-PARTY-NOTICES-dotnet-runtime.txt -Raw) -replace "`r`n", "`n"
          $checked = 0
          foreach ($deps in Get-ChildItem src/Riegel.Cli/obj/Release, src/Riegel/obj/Release -Recurse -Filter *.deps.json) {
            foreach ($m in [regex]::Matches((Get-Content $deps.FullName -Raw), 'runtimepack\.(Microsoft\.NETCore\.App\.Runtime\.[A-Za-z0-9-]+)/([0-9.]+)')) {
              $file = Join-Path $cache "$($m.Groups[1].Value.ToLowerInvariant())/$($m.Groups[2].Value)/THIRD-PARTY-NOTICES.TXT"
              if (-not (Test-Path $file)) { throw "Hinweise des Runtime-Pakets fehlen: $file" }
              if (((Get-Content $file -Raw) -replace "`r`n", "`n") -ne $ours) {
                throw "notices/THIRD-PARTY-NOTICES-dotnet-runtime.txt weicht von $($m.Value) ab – Datei vom passenden Tag übernehmen (notices/README.md)"
              }
              $checked++
            }
          }
          if ($checked -eq 0) { throw "Kein Runtime-Paket in den deps.json gefunden – Prüfung der Laufzeit-Hinweise läuft ins Leere" }
          Write-Host "Laufzeit-Hinweise passen zu $checked Runtime-Paketen"

      # ---- Signieren der Programmdateien (vor dem Packen, damit ZIP und MSI signierte Dateien enthalten) ----
      - name: Bei Azure anmelden
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Exe signieren (framework)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\framework
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe signieren (self-contained, für die MSI)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\self-contained
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe signieren (Einzeldatei Riegel.exe)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\standalone
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe signieren (riegel-win-x64.exe)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\cli-standalone
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe signieren (Sammler, vor dem Packen)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\collector-a
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sammler-Paket
        shell: pwsh
        run: |
          # Riegel-Collector.zip (docs/installation.md): Exe, .exe.config, collect-builtin.cmd (wenn vorhanden), README.txt, Lizenzen,
          # innere SHA256SUMS.txt – reproduzierbar gepackt und als collector\ neben die App kopiert (MSI, ZIP)
          $bundle = 'out/collector-bundle'
          New-Item -ItemType Directory -Force $bundle, dist | Out-Null
          Copy-Item out/collector-a/Riegel.Collector.exe, out/collector-a/Riegel.Collector.exe.config $bundle
          if (Test-Path tools/collect-builtin/collect-builtin.cmd) { Copy-Item tools/collect-builtin/collect-builtin.cmd $bundle }
          else { Write-Host "::notice::tools/collect-builtin/collect-builtin.cmd fehlt noch (Paket collector)" }
          if (Test-Path src/Riegel.Collector/README.txt) { Copy-Item src/Riegel.Collector/README.txt $bundle }
          else { [IO.File]::WriteAllText("$PWD/$bundle/README.txt", "Riegel collector ${{ steps.version.outputs.collector }} - see https://github.com/ict-baden/riegel/blob/main/docs/collector.md`n") }
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt $bundle
          ./.github/scripts/zip-deterministic.ps1 -Source $bundle -Destination "dist/Riegel-Collector${{ steps.version.outputs.suffix }}.zip" -SumsFile SHA256SUMS.txt
          foreach ($dir in 'out/framework', 'out/self-contained') {
            New-Item -ItemType Directory -Force "$dir/collector" | Out-Null
            Copy-Item "$bundle/*" "$dir/collector/"
          }

      - name: Nur-Lesen-Nachweis des Sammlers
        # docs/collector.md: vor dem MSI-Test, der Dienste und den Windows Installer weckt (sonst wartet der Nachweis lange auf
        # TiWorker/TrustedInstaller); Ergebnis als Release-Datei
        shell: pwsh
        run: |
          $out = "dist/Riegel-Collector-ReadOnlyProof${{ steps.version.outputs.suffix }}.txt"
          ./tools/readonly-proof/Invoke-ReadOnlyProof.ps1 -Target collector -Exe out/collector-bundle/Riegel.Collector.exe -Out $out
          if ($LASTEXITCODE -ne 0) { throw "Nur-Lesen-Nachweis fehlgeschlagen ($LASTEXITCODE)" }

      - name: Pakete schnüren
        shell: pwsh
        run: |
          # Lizenztexte gehören neben die Exe, ins ZIP und in die MSI (Richtlinie 06) – die csproj kopieren sie beim Publish
          foreach ($dir in 'out/framework', 'out/self-contained') {
            foreach ($file in 'LICENSE', 'THIRD-PARTY-NOTICES.txt', 'THIRD-PARTY-NOTICES-dotnet-runtime.txt', 'THIRD-PARTY-NOTICES-dotnet-wpf.txt',
                              'Riegel.exe', 'Riegel.Cli.exe', 'collector/Riegel.Collector.exe') {
              if (-not (Test-Path "$dir/$file")) { throw "$dir/$file fehlt." }
            }
          }
          $s = '${{ steps.version.outputs.suffix }}'
          Copy-Item README.md out/framework/
          Compress-Archive -Path out/framework/* -DestinationPath "dist/$env:APP$s-win-x64-framework.zip"
          Copy-Item "out/standalone/$env:APP.exe" "dist/$env:APP.exe"
          Copy-Item out/cli-standalone/Riegel.Cli.exe "dist/riegel$s-win-x64.exe"
          Copy-Item out/linux-x64/Riegel.Cli "dist/riegel$s-linux-x64"
          Copy-Item out/linux-arm64/Riegel.Cli "dist/riegel$s-linux-arm64"

      - name: MSI bauen
        shell: pwsh
        run: |
          # Self-contained: läuft ohne installierte .NET-Runtime; enthält Riegel.exe, Riegel.Cli.exe und collector\
          dotnet build "installer/$env:APP.Installer.wixproj" -c Release "-p:PublishDir=$PWD/out/self-contained/" -p:ProductVersion=${{ steps.version.outputs.msi }}
          if ($LASTEXITCODE -ne 0) { throw "MSI-Build fehlgeschlagen ($LASTEXITCODE)" }
          Copy-Item "installer/bin/Release/$env:APP.msi" "dist/$env:APP${{ steps.version.outputs.suffix }}-x64.msi"

      - name: MSI signieren
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: MSI-Installationstest (nur auf dem Wegwerf-Runner)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Neu installieren, dann Update von latest und vom neuesten Tag-Release: Dateien da, Dateiversion des neuen
          # Pakets, ein Eintrag in „Programme und Features“, Riegel.Cli.exe --version mit verlässlichem $LASTEXITCODE,
          # deinstallieren, Ordner weg. Läuft nur auf dem CI-Runner, nie auf einem Arbeitsplatz.
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Nur auf GitHub-Runnern.' }
          $msi = (Resolve-Path "dist/$env:APP${{ steps.version.outputs.suffix }}-x64.msi").Path
          $fileVersion = '${{ steps.version.outputs.filever }}'
          $dir = Join-Path $env:ProgramFiles 'Riegel'
          $n = 0
          function Invoke-Msi([string] $action, [string] $file) {
            $script:n++
            $log = Join-Path $PWD "msi-$script:n.log"
            $p = Start-Process msiexec.exe -ArgumentList $action, "`"$file`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "msiexec $action $(Split-Path $file -Leaf) endete mit $($p.ExitCode)" }
          }
          function Test-Installed([string] $label) {
            foreach ($f in 'Riegel.exe', 'Riegel.Cli.exe', 'collector\Riegel.Collector.exe') {
              if (-not (Test-Path (Join-Path $dir $f))) { throw "$label`: $f fehlt in der Installation" }
            }
            $found = (Get-Item "$dir\Riegel.exe").VersionInfo.FileVersion
            if ($found -ne $fileVersion) { throw "$label`: Riegel.exe hat die Dateiversion $found statt $fileVersion" }
            & "$dir\Riegel.Cli.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "$label`: Riegel.Cli.exe --version endete mit $LASTEXITCODE" }
            $arp = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.PSObject.Properties['DisplayName'] -and $_.DisplayName -eq 'Riegel' })
            if ($arp.Count -ne 1) { throw "$label`: $($arp.Count) Einträge 'Riegel' in Programme und Features" }
            Write-Host "$label`: Dateien da, Riegel.exe $found, ein Eintrag $($arp[0].DisplayVersion)"
          }
          function Remove-Installed([string] $label) {
            Invoke-Msi '/x' $msi
            if (Test-Path $dir) { Get-ChildItem $dir -Recurse | Select-Object -First 20; throw "$label`: $dir ist nach der Deinstallation noch da" }
          }
          # Die ersten drei Stellen der ProductVersion einer MSI (Windows Installer vergleicht nur diese)
          function Get-MsiVersion([string] $file) {
            $wi = New-Object -ComObject WindowsInstaller.Installer
            $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($file, 0))
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='ProductVersion'"))
            [void] $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            $value = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, @(1))
            [void] $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null)
            # Datenbank freigeben, bevor msiexec dieselbe Datei installiert
            foreach ($o in $record, $view, $db, $wi) { [void] [Runtime.InteropServices.Marshal]::ReleaseComObject($o) }
            [GC]::Collect(); [GC]::WaitForPendingFinalizers()
            $parts = ($value -split '\.')[0..2]
            return [version] ($parts -join '.')
          }

          Invoke-Msi '/i' $msi
          Test-Installed 'Neuinstallation'
          Remove-Installed 'Neuinstallation'

          # Updates: vom rollierenden Build latest und vom neuesten Tag-Release (bei einem Tag-Lauf das vorige Release)
          $old = Join-Path $env:RUNNER_TEMP 'msi-old'
          $sources = [Collections.Generic.List[object]]::new()
          gh release download latest -R $env:GITHUB_REPOSITORY -p 'Riegel-x64.msi' -D "$old/latest" --clobber
          if ($LASTEXITCODE -eq 0) { $sources.Add([pscustomobject]@{ Label = 'Update von latest'; File = "$old/latest/Riegel-x64.msi" }) }
          else { Write-Host '::notice::latest hat keine MSI - Update von latest nicht geprüft' }
          # Neuestes Tag-Release („Latest“); ohne Tag-Release liefert gh das rollierende latest
          $tag = gh release view -R $env:GITHUB_REPOSITORY --json tagName -q .tagName
          if ($LASTEXITCODE -eq 0 -and $tag -match '^v\d+\.\d+\.\d+$' -and $tag -ne $env:GITHUB_REF_NAME) {
            gh release download $tag -R $env:GITHUB_REPOSITORY -p "Riegel-$($tag.TrimStart('v'))-x64.msi" -D "$old/tag" --clobber
            if ($LASTEXITCODE -eq 0) { $sources.Add([pscustomobject]@{ Label = "Update von $tag"; File = "$old/tag/Riegel-$($tag.TrimStart('v'))-x64.msi" }) }
            else { Write-Host "::warning::MSI von $tag nicht ladbar - Update vom letzten Tag-Release nicht geprüft" }
          } else { Write-Host "::notice::Kein früheres Tag-Release - Update vom letzten Tag-Release nicht geprüft" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $sources.Count -eq 0) {
            Write-Host '::warning::Tag-Lauf ohne Vorgänger-MSI (weder latest noch ein früheres Tag-Release) - kein Update geprüft'
          }
          $newVersion = Get-MsiVersion $msi
          $tested = 0
          foreach ($s in $sources) {
            $oldVersion = Get-MsiVersion $s.File
            if ($oldVersion -gt $newVersion) { Write-Host "::warning::$($s.Label): $oldVersion ist neuer als $newVersion - übersprungen"; continue }
            Invoke-Msi '/i' $s.File
            Invoke-Msi '/i' $msi
            Test-Installed $s.Label
            Remove-Installed $s.Label
            $tested++
          }
          # Mindestens ein Update muss geprüft sein, sobald es einen Vorgänger gibt (sonst fiele der Test unbemerkt weg);
          # ohne jeden Vorgänger (erstes Release eines neuen Repos) bleibt es bei der Warnung oben
          if ($tested -eq 0 -and $sources.Count -gt 0) { throw 'Kein Update geprüft: alle Vorgänger-MSI waren neuer oder nicht installierbar' }
          Write-Host "MSI: Neuinstallation und $tested Update(s) geprüft, deinstalliert, Ordner entfernt."
          exit 0 # der Exitcode eines übersprungenen gh-Aufrufs gilt nicht als Ergebnis

      - name: AppLocker-Daten des Sammlers
        # Nur auf dem Runner: liest Dateiinformationen und gibt eine Hash-Regel als XML aus – wendet nichts an
        # Dauert sonst 1 s; ein hängender Runner hat hier einmal 33 Minuten verbraucht
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path out/collector-bundle/Riegel.Collector.exe).Path
          $dir = 'out/allowlist'
          New-Item -ItemType Directory -Force $dir | Out-Null
          try {
            $info = Get-AppLockerFileInformation -Path $exe
            ($info | Format-List * | Out-String -Width 200) | Out-File -Encoding utf8 "$dir/AppLockerFileInformation.txt"
            $xml = New-AppLockerPolicy -FileInformation $info -RuleType Hash -User Everyone -Xml
            [IO.File]::WriteAllText("$PWD/$dir/Riegel-Collector-AppLocker-HashRule.xml", $xml)
          } catch {
            "AppLocker data could not be generated on this runner: $_" | Out-File -Encoding utf8 "$dir/ERROR.txt"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$dir/SHA256.txt", "$hash  Riegel.Collector.exe`n")
          $readme = "Riegel collector ${{ steps.version.outputs.collector }} - AppLocker allow-list data`n`n" +
                    "AppLockerFileInformation.txt: output of Get-AppLockerFileInformation for Riegel.Collector.exe (incl. the hash as AppLocker sees it).`n" +
                    "Riegel-Collector-AppLocker-HashRule.xml: a hash rule generated with New-AppLockerPolicy -RuleType Hash -User Everyone -Xml. It was printed, not applied.`n" +
                    "SHA256.txt: SHA-256 of the exe (sha256sum format).`n`n" +
                    "Import the XML into your own AppLocker policy only after review. Once releases are signed, prefer a publisher rule.`n"
          [IO.File]::WriteAllText("$PWD/$dir/README.txt", $readme)

      - name: AppLocker-Daten packen
        shell: pwsh
        run: ./.github/scripts/zip-deterministic.ps1 -Source out/allowlist -Destination "dist/Riegel-Collector-allowlist${{ steps.version.outputs.suffix }}.zip"

      - name: Demo-Bericht
        shell: pwsh
        run: |
          # Riegel.exe --demo-report schreibt jedes Dokument O1–O15 (docs/reports.md) über die echte Engine; kein Upload
          $exe = (Resolve-Path out/self-contained/Riegel.exe).Path
          $target = Join-Path $PWD 'out/demo'
          $p = Start-Process -FilePath $exe -ArgumentList '--demo-report', "`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Riegel.exe --demo-report endete mit $($p.ExitCode)" }
          $expected = 'Riegel-Report_*.pdf', 'Riegel-Summary_*.pdf', 'Riegel-Overview_*.xlsx', 'results.csv', 'Riegel-Evidence_*.zip',
                      'Riegel-Soll-Konfiguration_*.pdf', 'Riegel-Soll-Konfiguration_*.xlsx', 'Riegel-Ausnahmen-zur-Genehmigung_*.pdf',
                      'Riegel-Erhebungsprotokoll_*.pdf', 'riegel-remediation.reg', 'riegel-rollback.reg', 'GptTmpl.inf', 'audit.csv',
                      'UEBERGABE.txt', '*.snapshot.json', '*.results.json', 'exceptions.json', 'tailoring.json', 'measures.json', 'check.txt'
          foreach ($pattern in $expected) {
            if (-not (Get-ChildItem $target -Recurse -Filter $pattern)) { throw "Demo-Bericht: $pattern fehlt" }
          }
          Get-ChildItem $target -Recurse -File | ForEach-Object { $_.FullName.Substring($target.Length + 1) }

      - name: Stückliste (SBOM)
        shell: pwsh
        run: |
          # CycloneDX-Stückliste der ausgelieferten Pakete und Runtime-Pakete (Windows und Linux) plus der Sammler
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore fehlgeschlagen ($LASTEXITCODE)" }
          $file = "dist/$env:APP${{ steps.version.outputs.suffix }}-sbom.cdx.json"
          $sbom = @("src/$env:APP/$env:APP.csproj", '--recursive', '--exclude-dev', '--output', 'dist',
                    '--filename', (Split-Path $file -Leaf), '--output-format', 'Json',
                    '--set-name', $env:APP, '--set-version', '${{ steps.version.outputs.version }}')
          dotnet dotnet-CycloneDX @sbom
          if ($LASTEXITCODE -ne 0) { throw "SBOM fehlgeschlagen ($LASTEXITCODE)" }
          # Alle ausgelieferten Programme: Oberfläche, Riegel.Cli.exe für Windows (bringt System.CodeDom mit, das die
          # Windows-Desktop-Runtime der Oberfläche schon enthält) und die Linux-Programme
          $deps = @(Get-ChildItem "src/$env:APP/obj/Release/*/win-x64/$env:APP.deps.json") +
                  @(Get-ChildItem 'src/Riegel.Cli/obj/Release/net10.0-windows/win-x64/Riegel.Cli.deps.json') +
                  @(Get-ChildItem 'src/Riegel.Cli/obj/Release/net10.0/linux-x64/Riegel.Cli.deps.json') +
                  @(Get-ChildItem 'src/Riegel.Cli/obj/Release/net10.0/linux-arm64/Riegel.Cli.deps.json')
          if ($deps.Count -ne 4) { throw "deps.json der Publish-Läufe nicht eindeutig gefunden ($($deps.Count))" }
          ./.github/scripts/sbom-shipped.ps1 -Sbom $file -DepsJson $deps.FullName -CollectorVersion '${{ steps.version.outputs.collector }}' `
            -WixProject installer/Riegel.Installer.wixproj

      - name: Prüfsummen
        shell: pwsh
        run: |
          # Nach dem Signieren, sonst stimmen die Summen nicht. Zeilenenden LF: mit CRLF scheitert `sha256sum -c` unter Linux.
          $sums = Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($sums -join "`n") + "`n", [Text.Encoding]::ASCII)
          Get-Content dist/SHA256SUMS.txt

      - name: Herkunftsnachweis
        # Nur für öffentliche Repos; für private bräuchte es GitHub Enterprise (Richtlinie 05)
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Prüfsummen als Artefakt
        # Klein und nur zur Fehlersuche; die Releases unten nehmen dist/ direkt
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pruefsummen-${{ steps.version.outputs.version }}
          path: |
            dist/SHA256SUMS.txt
            dist/Riegel-Collector-ReadOnlyProof*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Release erstellen (nur bei Tag v*)
        if: github.ref_type == 'tag' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # v1.0.0-rc1 und ähnliche: Vorabversion, nicht „Latest“
          # @(...) um das if: ein if gibt ein Array mit einem Element als String zurück, @pre zerlegte ihn in Zeichen
          $pre = @(if ($env:GITHUB_REF_NAME -match '-') { '--prerelease' })
          # Genau die elf Release-Dateien (README, docs/installation.md) mit Versionsnummer (Riegel.exe ohne) – sonst kein Release
          $s = '${{ steps.version.outputs.suffix }}'
          $expected = "$env:APP$s-x64.msi", "$env:APP.exe", "$env:APP$s-win-x64-framework.zip", "riegel$s-win-x64.exe", "riegel$s-linux-x64",
                      "riegel$s-linux-arm64", "Riegel-Collector$s.zip", "Riegel-Collector-allowlist$s.zip", "Riegel-Collector-ReadOnlyProof$s.txt",
                      "$env:APP$s-sbom.cdx.json", 'SHA256SUMS.txt'
          $files = @(Get-ChildItem dist -File)
          $absent = @($expected | Where-Object { $_ -notin $files.Name })
          $extra = @($files.Name | Where-Object { $_ -notin $expected })
          if ($absent.Count -gt 0 -or $extra.Count -gt 0) { throw "Dateien in dist/: fehlen [$($absent -join ', ')], unerwartet [$($extra -join ', ')] – kein Release." }
          # Release-Text (Englisch): englischer Teil des CHANGELOG-Abschnitts, Sammler-Version und SHA-256, Dateiliste;
          # „unchanged since“, wenn ältere Tags dieselben Sammler-Bytes hatten
          $hash = '${{ steps.collector.outputs.sha256 }}'
          $since = ''
          try {
            git fetch --quiet --depth=1 origin '+refs/tags/v*:refs/tags/v*'
            $current = [version](($env:GITHUB_REF_NAME -replace '^v', '') -replace '[-+].*$', '')
            $older = @(git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and [version]$_.Substring(1) -lt $current } |
                       Sort-Object { [version]$_.Substring(1) } -Descending)
            $lock = 'src/Riegel.Collector/collector.sha256'
            foreach ($tag in $older) {
              if (-not (git ls-tree --name-only $tag $lock)) { break }
              if ((git show "${tag}:$lock" | Out-String).Trim().ToLower() -ne $hash) { break }
              $since = $tag
            }
          } catch {
            Write-Host "::warning::Vergleich des Sammlers mit älteren Tags nicht möglich: $_"
          }
          $notes = ./.github/scripts/release-notes.ps1 -Version '${{ steps.version.outputs.version }}' -Collector '${{ steps.version.outputs.collector }}' `
            -CollectorSha256 $hash -Since $since -Signed:($env:SIGN -eq 'true')
          $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($file, $notes + "`n", [Text.UTF8Encoding]::new($false))
          Write-Host $notes
          # Kein --generate-notes: das nannte deutsche PR-Titel und „New Contributors“
          gh release create $env:GITHUB_REF_NAME $files.FullName --title "$env:APP $env:GITHUB_REF_NAME" --notes-file $file @pre
          if ($LASTEXITCODE -ne 0) { throw "Release ließ sich nicht anlegen ($LASTEXITCODE)" }

      - name: "Release 'latest' aktualisieren (main)"
        # Push mit [voll], Nachtlauf und Start von Hand auf main; der Tag 'latest' zeigt danach auf diesen Commit (Job „gate“)
        if: needs.gate.outputs.full == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Rollierendes Release: immer der neueste main-Stand, unter festen Links (Einzelheiten im Skript)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/latest"
          $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $signed = if ($env:SIGN -eq 'true') { 'signed' } else { 'not yet code-signed' }
          $collector = "Collector ${{ steps.version.outputs.collector }}, SHA-256 (unsigned) ${{ steps.collector.outputs.sha256 }}"
          $notes = "Automatic pre-release build of main ($($env:GITHUB_SHA.Substring(0,7))), version ${{ steps.version.outputs.version }}, built $built UTC, $signed. $collector.`n`n" +
                   "The links stay the same and always point to the newest build. On OT and validated machines use the tagged releases, never 'latest'.`n`n" +
                   "- **[$env:APP-x64.msi]($base/$env:APP-x64.msi)**: evaluation app for all users (Intune/GPO) – not the way onto OT machines`n" +
                   "- **[$env:APP.exe]($base/$env:APP.exe)**: desktop app as a single file, no installation, no .NET runtime needed`n" +
                   "- **[$env:APP-win-x64-framework.zip]($base/$env:APP-win-x64-framework.zip)**: small variant with Riegel.Cli.exe and collector\, needs the .NET 10 Desktop Runtime`n" +
                   "- **[riegel-win-x64.exe]($base/riegel-win-x64.exe)**: command line for Windows as a single file (scripts, scheduled checks)`n" +
                   "- **[riegel-linux-x64]($base/riegel-linux-x64)** / **[riegel-linux-arm64]($base/riegel-linux-arm64)**: command line for Linux (auditors, CI); arm64 without runtime test`n" +
                   "- **[Riegel-Collector.zip]($base/Riegel-Collector.zip)**: portable collector for OT and legacy machines (Windows 7 SP1 to 11), installs nothing`n" +
                   "- [Riegel-Collector-allowlist.zip]($base/Riegel-Collector-allowlist.zip): AppLocker data for the collector`n" +
                   "- [Riegel-Collector-ReadOnlyProof.txt]($base/Riegel-Collector-ReadOnlyProof.txt): read-only proof of this build`n" +
                   "- [Riegel-sbom.cdx.json]($base/Riegel-sbom.cdx.json): bill of materials (CycloneDX)`n" +
                   "- [SHA256SUMS.txt]($base/SHA256SUMS.txt): checksums"
          $expected = 'Riegel-x64.msi', 'Riegel.exe', 'Riegel-win-x64-framework.zip', 'riegel-win-x64.exe', 'riegel-linux-x64', 'riegel-linux-arm64',
                      'Riegel-Collector.zip', 'Riegel-Collector-allowlist.zip', 'Riegel-Collector-ReadOnlyProof.txt', 'Riegel-sbom.cdx.json', 'SHA256SUMS.txt'
          ./.github/scripts/release-latest.ps1 -Notes $notes -Title "Latest Build (main) – ${{ steps.version.outputs.version }}" -Expected $expected

  release-check:
    # Nach dem Veröffentlichen unter Linux nachprüfen, was ein Kunde herunterlädt: genau die elf Release-Dateien,
    # SHA256SUMS.txt mit LF und `sha256sum -c`, die innere Prüfsummendatei des Sammler-Pakets, die Linux-Befehlszeile
    # startet. Lädt aus dem Release, nicht aus Artefakten (Linux-Minuten zählen einfach).
    needs: [gate, windows]
    if: >-
      needs.gate.outputs.full == 'true' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && github.event_name == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Release herunterladen und prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; s="-${GITHUB_REF_NAME#v}"; else tag=latest; s=""; fi
          dir="$RUNNER_TEMP/release"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$dir"
          cd "$dir"
          want=$(printf '%s\n' "Riegel$s-x64.msi" Riegel.exe "Riegel$s-win-x64-framework.zip" "riegel$s-win-x64.exe" "riegel$s-linux-x64" \
            "riegel$s-linux-arm64" "Riegel-Collector$s.zip" "Riegel-Collector-allowlist$s.zip" "Riegel-Collector-ReadOnlyProof$s.txt" \
            "Riegel$s-sbom.cdx.json" SHA256SUMS.txt | LC_ALL=C sort)
          have=$(ls -1 | LC_ALL=C sort)
          if [ "$have" != "$want" ]; then
            diff <(echo "$want") <(echo "$have") || true
            echo "::error::Dateien von '$tag' weichen von der Liste der elf Release-Dateien ab"; exit 1
          fi
          if grep -q $'\r' SHA256SUMS.txt; then echo "::error::SHA256SUMS.txt hat CRLF-Zeilenenden"; exit 1; fi
          listed=$(awk '{print $2}' SHA256SUMS.txt | LC_ALL=C sort)
          if [ "$listed" != "$(echo "$want" | grep -vx SHA256SUMS.txt)" ]; then echo "::error::SHA256SUMS.txt nennt nicht genau die übrigen Dateien"; exit 1; fi
          sha256sum -c SHA256SUMS.txt
          mkdir collector
          unzip -q "Riegel-Collector$s.zip" -d collector
          (cd collector && sha256sum -c SHA256SUMS.txt)
          chmod +x "riegel$s-linux-x64"
          version=$("./riegel$s-linux-x64" --version)
          echo "$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$version" != "Riegel ${GITHUB_REF_NAME#v} "* ]]; then
            echo "::error::riegel$s-linux-x64 meldet nicht die Version ${GITHUB_REF_NAME#v}"; exit 1
          fi
          echo "Release '$tag': 11 Dateien, SHA256SUMS.txt und Sammler-Prüfsummen stimmen, Linux-Befehlszeile startet."
